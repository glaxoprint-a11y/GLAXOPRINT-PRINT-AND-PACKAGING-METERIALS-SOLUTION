<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Reward Approval Management</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: radial-gradient(circle at top left, #1e1b4b, #0f172a 70%); color: #f8fafc; min-height: 100vh; padding: 20px; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px 24px; border-radius: 18px; backdrop-filter: blur(12px); margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 1.4rem; color: #38bdf8; }
    .btn-back { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #cbd5e1; padding: 9px 18px; border-radius: 10px; cursor: pointer; text-decoration: none; font-size: 0.88rem; transition: 0.3s; }
    .btn-back:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .table-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; padding: 20px; backdrop-filter: blur(12px); }
    .section-title { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 16px; font-weight: 600; }
    
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.88rem; }
    th { background: rgba(0, 0, 0, 0.3); color: #94a3b8; font-weight: 600; }

    .btn-action { padding: 6px 14px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.8rem; cursor: pointer; margin-right: 6px; transition: 0.3s; }
    .btn-approve { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
    .btn-approve:hover { background: rgba(16, 185, 129, 0.4); color: #fff; }
    
    .btn-reject { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; }
    .btn-reject:hover { background: rgba(239, 68, 68, 0.4); color: #fff; }

    .badge-uid { font-size: 0.8rem; color: #818cf8; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); padding: 3px 8px; border-radius: 20px; }
    .badge-brand { font-size: 0.8rem; color: #38bdf8; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); padding: 3px 8px; border-radius: 6px; }

    .loading { text-align: center; color: #94a3b8; padding: 20px; font-style: italic; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <h1>🎁 Customer Spin Reward Approvals</h1>
      <a href="AdminDashboard.html" class="btn-back">← Back to Dashboard</a>
    </div>

    <div class="table-card">
      <div class="section-title">Pending & Won Rewards List (স্পিন করা পুরস্কারের তালিকা)</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Customer UID</th>
              <th>Product Name</th>
              <th>Brand Name</th>
              <th>Reward Won</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="rewardRequestsTable">
            <tr>
              <td colspan="7" class="loading">ডাটা লোড হচ্ছে...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxpO6TXjmn0Y1axPmS8QyaqGQU_8MWDfp53LNMQ3D3aJDBujwLFtXxtH7S8RyTcrSBr/exec";

  window.onload = function() {
    // কোনো সিকিউরিটি গার্ড বা চেক ছাড়াই সরাসরি ডাটা লোড ফাংশন কল হবে
    fetchRewardRequests(); 
  };

  function fetchRewardRequests() {
    fetch(WEB_APP_URL + "?action=getAdminRewardRequests")
      .then(response => response.json())
      .then(data => {
        renderRewardTable(data.requests);
      })
      .catch(error => {
        console.error("Error loading requests:", error);
        document.getElementById('rewardRequestsTable').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ef4444;">তথ্য লোড করতে সমস্যা হয়েছে।</td></tr>';
      });
  }

  function renderRewardTable(requests) {
    var tbody = document.getElementById('rewardRequestsTable');
    tbody.innerHTML = '';

    if (!requests || requests.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8;">কোনো পেন্ডিং রিওয়ার্ড রিকোয়েস্ট নেই।</td></tr>';
      return;
    }

    requests.forEach(function(req) {
      var statusColor = req.status === "Approved" ? "#10b981" : "#f59e0b";
      var tr = '<tr>' +
        '<td>' + req.date + '</td>' +
        '<td><span class="badge-uid">' + req.uid + '</span></td>' +
        '<td>' + req.productName + '</td>' +
        '<td><span class="badge-brand">' + req.brandName + '</span></td>' +
        '<td style="font-weight:600; color:#38bdf8;">' + req.itemName + '</td>' +
        '<td><span style="color:' + statusColor + '; font-weight:600;">' + req.status + '</span></td>' +
        '<td>' +
          '<button class="btn-action btn-approve" onclick="updateStatus(' + req.rowId + ', \'Approved\')">Accept</button>' +
          '<button class="btn-action btn-reject" onclick="updateStatus(' + req.rowId + ', \'Rejected\')">Reject</button>' +
        '</td>' +
      '</tr>';
      tbody.innerHTML += tr;
    });
  }

  function updateStatus(rowId, status) {
    if (!confirm("আপনি কি নিশ্চিতভাবে এই রিকোয়েস্টটি " + status + " করতে চান?")) {
      return;
    }

    var payload = {
      action: "updateRewardStatus",
      rowId: rowId,
      status: status
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(result => {
      alert(result.message);
      fetchRewardRequests(); // টেবিল রিফ্রেশ করা
    })
    .catch(error => {
      console.error("Error updating status:", error);
      alert("স্ট্যাটাস আপডেট করতে সমস্যা হয়েছে।");
    });
  }
</script>
</body>
</html>
